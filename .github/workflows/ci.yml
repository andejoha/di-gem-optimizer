name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      vite_base:
        type: string
        default: '/'
      upload_pages_artifact:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
        env:
          VITE_BASE: ${{ inputs.vite_base || '/' }}
      - run: npm test
      - if: ${{ inputs.upload_pages_artifact }}
        run: cp dist/index.html dist/404.html
      - if: ${{ inputs.upload_pages_artifact }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
